<div *ngIf="job; else notFound" class="space-y-4">
  <h2 class="text-2xl font-bold text-blue-600">
    {{ job.title }}
  </h2>

  <p class="text-gray-600">
    {{ job.company }} • {{ job.location }} • {{ job.level }}
  </p>

  <p class="text-gray-800">
    {{ job.description }}
  </p>

  <div class="flex flex-wrap gap-2">
    <span
      *ngFor="let tag of job.tags"
      class="rounded bg-blue-100 px-2 py-1 text-xs text-blue-700"
    >
      {{ tag }}
    </span>
  </div>
</div>

<ng-template #notFound>
  <p class="text-red-600">Vaga não encontrada.</p>
</ng-template>
